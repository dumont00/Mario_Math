<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Les Aventures du Calcul</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="phaser-game"></div>

        <div id="touch-controls" class="touch-controls">
            <div class="touch-controls__left">
                <button id="btn-left" class="touch-btn" aria-label="Aller à gauche">◀</button>
                <button id="btn-right" class="touch-btn" aria-label="Aller à droite">▶</button>
            </div>
            <div class="touch-controls__right">
                <button id="btn-jump" class="touch-btn touch-btn--jump" aria-label="Sauter">SAUT</button>
            </div>
        </div>

        <div id="menu-screen" class="modal" hidden aria-hidden="true" role="dialog" aria-modal="true">
            <div class="modal__panel modal__panel--menu">
                <h1 class="modal__titre">Les Aventures du Calcul</h1>
                <p class="modal__sous-titre">Choisis ton mode :</p>

                <div class="menu__choix">
                    <button id="menu-btn-aventure" class="menu__btn">
                        <span class="menu__btn-titre">Aventure</span>
                        <span class="menu__btn-detail">Niveaux 1 à 20 — 5 mondes, tous les domaines</span>
                    </button>
                    <button id="menu-btn-mult" class="menu__btn">
                        <span class="menu__btn-titre">Entraînement — Tables de multiplication</span>
                        <span class="menu__btn-detail">30 multiplications de 1 à 12 (accent sur 4, 6, 7, 8, 9, 11, 12)</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="result-screen" class="modal" hidden aria-hidden="true" role="dialog" aria-modal="true">
            <div class="modal__panel modal__panel--end">
                <h2 class="modal__titre" id="result-titre">Niveau terminé !</h2>
                <p class="modal__sous-titre" id="result-sous-titre">Beau parcours, regarde tes résultats :</p>

                <div class="result__etoiles" id="result-etoiles" aria-label="étoiles obtenues"></div>

                <ul class="modal__recap">
                    <li>Niveau : <strong id="result-niveau">1</strong></li>
                    <li>Score : <strong id="result-score">0</strong></li>
                    <li>Cristaux : <strong id="result-cristaux">0 / 20</strong></li>
                    <li>Réussite : <strong id="result-pourcent">0 %</strong></li>
                </ul>

                <h3 class="result__sous-titre">Par domaine</h3>
                <div class="result__domaines" id="result-domaines"></div>

                <div class="result__actions">
                    <button id="result-replay"  class="modal__continue modal__continue--sec">Rejouer</button>
                    <button id="result-next"    class="modal__continue">Niveau suivant ▶</button>
                </div>
            </div>
        </div>

        <div id="question-modal" class="modal" hidden aria-hidden="true" role="dialog" aria-modal="true">
            <div class="modal__panel">
                <header class="modal__header">
                    <span class="modal__domain" id="modal-domain">Domaine</span>
                    <span class="modal__stars" id="modal-stars">★</span>
                </header>

                <div class="modal__timebar" aria-hidden="true">
                    <div class="modal__timebar-fill" id="modal-timebar-fill"></div>
                </div>

                <div class="modal__visuel" id="modal-visuel" hidden></div>

                <p class="modal__question" id="modal-question">Énoncé…</p>

                <div class="modal__choices" id="modal-choices"></div>

                <div class="modal__feedback" id="modal-feedback" hidden>
                    <p class="modal__feedback-text" id="modal-feedback-text"></p>
                    <p class="modal__explication" id="modal-explication"></p>
                </div>

                <button class="modal__continue" id="modal-continue" hidden>Continuer</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    <script src="config.js"></script>
    <script src="js/Visuels.js"></script>
    <script src="js/ScoreManager.js"></script>
    <script src="js/QuestionManager.js"></script>
    <script src="js/QuestionModal.js"></script>
    <script src="js/scenes/BootScene.js"></script>
    <script src="js/scenes/MenuScene.js"></script>
    <script src="js/scenes/LevelScene.js"></script>
    <script src="js/scenes/ResultScene.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
